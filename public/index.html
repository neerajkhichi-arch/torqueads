<title>Torque Ad Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
<style>
:root{
  --ground:#F8F9FA; --surface:#FFFFFF; --sunk:#F1F3F4; --hover:#F1F3F4; --line:#DADCE0; --line-2:#BDC1C6;
  --ink:#202124; --ink-2:#5F6368; --ink-3:#80868B;
  --accent:#1A73E8; --accent-strong:#1967D2; --accent-ink:#FFFFFF; --accent-soft:#E8F0FE; --accent-soft-ink:#174EA6;
  --amber:#B06000; --amber-soft:#FEF7E0; --fix:#B3640F;
  --good:#188038; --good-soft:#E6F4EA; --warn:#B06000; --warn-soft:#FEF7E0; --bad:#D93025; --bad-soft:#FCE8E6;
  --c1:#1A73E8; --c2:#E8710A; --c3:#9334E6; --c4:#12A4AF;
  --shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --shadow-2:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --display:"Google Sans","Google Sans Flex","Google Sans Text",Roboto,Arial,sans-serif;
  --body:Roboto,"Google Sans Text",Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#131314; --surface:#1E1F20; --sunk:#282A2C; --hover:#2D2F31; --line:#3C4043; --line-2:#5F6368;
    --ink:#E3E3E3; --ink-2:#C4C7C5; --ink-3:#8E918F;
    --accent:#A8C7FA; --accent-strong:#7CACF8; --accent-ink:#062E6F; --accent-soft:#0B3A76; --accent-soft-ink:#D3E3FD;
    --amber:#FDD663; --amber-soft:#3D3212; --fix:#E8A13B;
    --good:#81C995; --good-soft:#0F3A20; --warn:#FDD663; --warn-soft:#3D3212; --bad:#F28B82; --bad-soft:#3E1714;
    --c1:#4F8BEE; --c2:#CC7A2C; --c3:#A774E8; --c4:#23A0AA;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-2:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#131314; --surface:#1E1F20; --sunk:#282A2C; --hover:#2D2F31; --line:#3C4043; --line-2:#5F6368;
    --ink:#E3E3E3; --ink-2:#C4C7C5; --ink-3:#8E918F;
    --accent:#A8C7FA; --accent-strong:#7CACF8; --accent-ink:#062E6F; --accent-soft:#0B3A76; --accent-soft-ink:#D3E3FD;
    --amber:#FDD663; --amber-soft:#3D3212; --fix:#E8A13B;
    --good:#81C995; --good-soft:#0F3A20; --warn:#FDD663; --warn-soft:#3D3212; --bad:#F28B82; --bad-soft:#3E1714;
    --c1:#4F8BEE; --c2:#CC7A2C; --c3:#A774E8; --c4:#23A0AA;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-2:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.43;letter-spacing:.2px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msi{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;overflow:hidden;width:1em;flex:none;user-select:none}
.msi.s18{font-size:18px} .msi.s20{font-size:20px}

/* ---------- top app bar ---------- */
.gbar{display:flex;align-items:center;gap:8px;padding:8px 20px 8px 8px;background:var(--ground);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;min-height:72px}
.iconbtn{border:0;background:transparent;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--hover)}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 0 2px;color:var(--ink-2);white-space:nowrap}
.logo svg{width:32px;height:32px;flex:none}
.logo .wm{display:flex;flex-direction:column;line-height:1.05}
.logo b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:0;color:var(--ink-2)}
.logo .by{font-size:11.5px;color:var(--ink-3);letter-spacing:.2px;margin-top:2px}
.logo .by strong{font-weight:500;color:var(--ink-2)}
.acct-sel{position:relative;display:flex;flex-direction:column;padding:2px 30px 2px 10px;border-radius:6px;cursor:pointer;min-width:0}
.acct-sel:hover{background:var(--hover)}
.acct-sel .a-top{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:2px;white-space:nowrap}
.acct-sel .a-main{font-family:var(--display);font-size:18px;color:var(--ink);white-space:nowrap;display:flex;align-items:baseline;gap:10px}
.acct-sel .a-main small{font-family:var(--body);font-size:13px;color:var(--ink-2)}
.acct-sel .msi.dd{position:absolute;right:4px;bottom:6px;color:var(--ink-2)}
.acct-sel select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.gbar .sp{flex:1}
.tool{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:12.5px;position:relative;min-width:64px}
.tool:hover{background:var(--hover)}
.tool .badge{position:absolute;top:2px;right:14px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:12px;padding-left:14px;margin-left:6px;border-left:1px solid var(--line);text-align:right;font-size:13px;color:var(--ink)}
.who small{display:block;color:var(--ink-2);font-size:12.5px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:500;font-size:14px;flex:none}
.pop{position:absolute;top:calc(100% + 4px);right:0;background:var(--surface);border-radius:8px;box-shadow:var(--shadow-2);width:340px;max-width:calc(100vw - 32px);z-index:40;padding:8px 0;text-align:left}
.pop.left{left:0;right:auto}
.pop .pi{display:flex;gap:12px;padding:10px 16px;font-size:14px;color:var(--ink);cursor:pointer;border:0;background:none;width:100%;text-align:left;align-items:flex-start}
.pop .pi:hover{background:var(--hover)}
.pop .pi .msi{color:var(--ink-2)}
.pop .pi small{display:block;color:var(--ink-2);font-size:12.5px}
.pop .ph{padding:6px 16px 8px;font-size:13px;color:var(--ink-2);font-weight:500}
.pop input{margin:4px 12px 8px;width:calc(100% - 24px)}

/* banner */
#banner:empty{display:none}
.banner{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 16px 10px 20px;margin:0 20px 8px;flex-wrap:wrap}
.banner>.msi{color:var(--warn)}
.banner p{margin:0;flex:1;min-width:260px;font-size:14px;color:var(--ink)}
.banner p b{font-weight:500}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:96px 292px minmax(0,1fr);align-items:start}
.shell.collapsed{grid-template-columns:96px minmax(0,1fr)}
.shell.collapsed .subnav{display:none}
.rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 24px;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));max-height:calc(100vh - 72px);overflow:visible;z-index:15}
.rail .pop{z-index:60}
.fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow-2);display:grid;place-items:center;cursor:pointer;color:var(--accent);flex:none}
.fab .msi{font-size:34px;font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 48}
.fab:hover{background:var(--accent-soft)}
.fablbl{font-size:13px;color:var(--ink-2);margin-top:-6px;margin-bottom:14px}
.rail-item{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink-2);font-size:13px;padding:0;width:84px;position:relative}
.rail-item .ic{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.rail-item:hover .ic{background:var(--hover)}
.rail-item[aria-current="true"]{color:var(--accent);font-weight:500}
.rail-item[aria-current="true"] .ic{background:var(--accent);color:var(--accent-ink)}
.rail-item[aria-current="true"] .msi{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.subnav{padding:4px 16px 40px 8px;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));max-height:calc(100vh - 72px);overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.nitem{border:0;background:none;text-align:left;padding:0 24px;min-height:52px;border-radius:26px;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--display);width:100%}
.nitem:hover{background:var(--hover)}
.nitem[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nitem[aria-current="page"]:hover{background:var(--accent-strong)}
.ngroup{background:var(--surface);border-radius:26px;padding:4px 10px 10px}
.ngroup>.nitem{color:var(--accent);font-weight:400;justify-content:space-between;padding:0 14px}
.ngroup>.nitem:hover{background:var(--accent-soft)}
.ngroup .kids{display:flex;flex-direction:column;gap:4px}
.ngroup .kids .nitem{padding-left:34px}
.nitem .ct{margin-left:auto;font-size:12.5px;color:inherit;opacity:.8;font-family:var(--body)}

/* main */
.main{min-width:0;padding:0 20px 60px 8px}
.scope{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0 12px}
.scard{position:relative;background:var(--surface);box-shadow:var(--shadow);border-radius:4px;padding:8px 44px 8px 16px;min-width:220px;display:flex;flex-direction:column;cursor:pointer;max-width:100%}
.scard:hover{background:var(--ground)}
.scard .l{font-size:13px;color:var(--ink-2)}
.scard .v{font-size:17px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;display:flex;align-items:center;gap:8px}
.scard .v .msi{font-size:18px;color:var(--ink-2)}
.scard>.msi.dd{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.scard select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.scard.cur::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.statusline{display:flex;gap:28px;align-items:center;font-size:15px;color:var(--ink);padding:2px 4px 16px;flex-wrap:wrap}
.statusline .k{color:var(--ink-2)}
.statusline .u{border-bottom:1px dashed var(--ink-3)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px;padding:4px 6px;border-radius:4px;font-family:var(--display)}
.linkbtn:hover{background:var(--accent-soft)}
.phead{display:flex;align-items:center;gap:10px;padding:18px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.phead h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:0;color:var(--ink)}
.phead .help{color:var(--ink-2)}
.phead .sp{flex:1}
.datepick{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.datepick .lbl{color:var(--ink-2);font-size:15px}
.datepick .box{position:relative;border:1px solid var(--ink-3);border-radius:4px;padding:10px 44px 10px 16px;font-size:16px;min-width:200px;background:var(--surface);color:var(--ink)}
.datepick .box select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.datepick .box .msi{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.content{display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%}
.sample-flag{font-size:12px;color:var(--ink-2);background:var(--sunk);padding:4px 10px;border-radius:99px;white-space:nowrap}

/* ---------- primitives ---------- */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:56px}
.panel>header h2{font-family:var(--display);font-size:16px;font-weight:500;margin:0;color:var(--ink)}
.panel>header .sub{font-size:13px;color:var(--ink-2)}
.panel>header .sp{flex:1}
.panel .body{padding:16px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.kpi{padding:14px 18px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kpi:last-child{border-right:0}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .d{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.up{color:var(--good)} .dn{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--accent);height:36px;padding:0 16px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;font-family:var(--display);letter-spacing:.25px}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-strong);box-shadow:var(--shadow)}
.btn.fix{background:var(--fix);border-color:var(--fix);color:#fff;height:40px;padding:0 24px}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed;background:var(--sunk);color:var(--ink-3);border-color:var(--sunk);box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap;color:var(--ink)}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--good);flex:none;box-sizing:border-box}
.pill.sched::before{background:transparent;border:2px solid var(--accent)}
.pill.paused::before{background:var(--ink-3);border-radius:2px}
.pill.limited::before{background:var(--warn)}
.pill.ended::before{background:var(--line-2)}
.pill.bad::before{background:var(--bad)}
.tag{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.site-cd,.tag.site-bd,.tag.site-zw{background:transparent;border:1px solid var(--line);color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:14px;color:var(--ink);font-weight:500;text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);vertical-align:bottom}
th.m{text-decoration:underline dashed var(--ink-3);text-underline-offset:5px}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
tbody tr:hover td{background:var(--ground)}
tr.total td{background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.cb,th.cb{width:52px;padding-left:20px;padding-right:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink-2)} .ink2{color:var(--ink-2)}
.cname{color:var(--accent);border:0;background:none;padding:0;cursor:pointer;text-align:left;font-size:14px}
.cname:hover{text-decoration:underline}
.bar{height:6px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
label.f,.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{border:1px solid var(--ink-3);background:var(--surface);border-radius:4px;padding:0 12px;height:40px;font-size:14px;width:100%;color:var(--ink)}
input[type=text]:hover,input[type=number]:hover,input[type=url]:hover,select:hover{border-color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
textarea{min-height:70px;resize:vertical;padding:8px 12px}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px;color:var(--ink)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.opt{border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--surface);text-align:left;color:var(--ink)}
.opt:hover{background:var(--ground)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt b{font-size:14.5px;font-weight:500;font-family:var(--display)}
.opt small{color:var(--ink-2);font-size:12.5px;line-height:1.45}
.seg{display:inline-flex;border:1px solid var(--ink-3);border-radius:20px;overflow:hidden;max-width:100%;overflow-x:auto}
.seg button{border:0;background:var(--surface);padding:0 16px;height:36px;cursor:pointer;font-size:14px;font-weight:500;border-right:1px solid var(--ink-3);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-family:var(--display);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-soft-ink)}
.seg button[aria-pressed="true"]::before{content:"check";font-family:"Material Symbols Outlined";font-size:18px;font-weight:400}
.note{font-size:13.5px;color:var(--ink);background:var(--sunk);border-radius:8px;padding:12px 16px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)} .note.good{background:var(--good-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:13px;color:var(--ink-2);font-weight:500}
.big{font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;font-size:32px;line-height:1.15}
/* toolbar above tables */
.tbar{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:64px}
.tbar .filter{display:flex;align-items:center;gap:16px;flex:1;min-width:200px;color:var(--ink-2)}
.tbar .filter input{border:0;height:44px;padding:0;background:transparent;box-shadow:none!important;font-size:15px}
.tbar .tsel{position:relative;display:flex;align-items:center;gap:4px;font-size:15px;color:var(--ink);padding:0 12px;height:40px;border-radius:4px}
.tbar .tsel:hover{background:var(--hover)}
.tbar .tsel select{position:absolute;inset:0;opacity:0;cursor:pointer;height:100%}
.tbar .vdiv{width:1px;height:40px;background:var(--line);margin:0 6px}

<script>
/* =========================================================
   TORQUE — first-party automotive ad platform (prototype)
   Everything below runs in the browser on generated sample data.
   ========================================================= */
const TODAY = new Date('2026-09-23T12:00:00+05:30');
const DAY = 86400000;
const K_ANON = 1000;          // minimum users for any targetable audience
const REPORT_K = 100;         // minimum impressions before a report row is shown

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){ let s = 0; for (const c of String(seed)) s = (s*31 + c.charCodeAt(0)) >>> 0; return () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; }; }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const sum = a => a.reduce((x,y)=>x+y,0);
function fmtN(n){ n = +n||0; if (n>=1e7) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if (n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if (n>=1e3) return (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'K'; return Math.round(n).toLocaleString('en-IN'); }
function fmtINR(n){ n = +n||0; const a=Math.abs(n); if (a>=1e7) return '₹'+(n/1e7).toFixed(2).replace(/\.?0+$/,'')+'Cr'; if (a>=1e5) return '₹'+(n/1e5).toFixed(2).replace(/\.?0+$/,'')+'L'; if (a>=1e3) return '₹'+(n/1e3).toFixed(1).replace(/\.0$/,'')+'K'; return '₹'+n.toFixed(n<100&&n%1?2:0); }
const fmtINRx = n => '₹'+Math.round(n).toLocaleString('en-IN');
const pct = (n,d=1) => (isFinite(n)? (n*100).toFixed(d):'0')+'%';
const dstr = d => new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const iso = d => new Date(d).toISOString().slice(0,10);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- properties & traffic (sample) ---------- */
const SITES = {
  cd:{ id:'cd', name:'CarDekho',  uv:28e6,  pv:196e6, car:1,   bike:0 },
  bd:{ id:'bd', name:'BikeDekho', uv:6.4e6, pv:31e6,  car:0,   bike:1 },
  zw:{ id:'zw', name:'ZigWheels', uv:9.2e6, pv:47e6,  car:.68, bike:.32 },
};
const PAGE_TYPES = {
  cd:[['home','Homepage',.07],['listing','Car listing',.15],['model','Car model / detail',.30],['search','Search',.07],['compare','Comparison',.08],['used','Used-car pages',.17],['offers','Offers',.07],['emi','EMI / finance',.09]],
  bd:[['home','Homepage',.09],['listing','Bike listing',.20],['model','Bike model / detail',.38],['compare','Comparison',.10],['search','Search',.10],['offers','Offers',.13]],
  zw:[['carpages','Car pages',.33],['bikepages','Bike pages',.19],['compare','Comparison',.10],['search','Search',.08],['ev','EV pages',.09],['reviews','Reviews',.21]],
};
const pageName = (site, pt) => (PAGE_TYPES[site].find(p=>p[0]===pt)||[pt,pt])[1];

const FORMATS = {
  '300x250':{w:300,h:250,kind:'Display',dev:'both'}, '300x600':{w:300,h:600,kind:'Display',dev:'desktop'},
  '728x90':{w:728,h:90,kind:'Display',dev:'desktop'}, '970x250':{w:970,h:250,kind:'Display',dev:'desktop'},
  '320x50':{w:320,h:50,kind:'Display',dev:'mobile'}, '320x100':{w:320,h:100,kind:'Display',dev:'mobile'},
  'native':{w:300,h:250,kind:'Native',dev:'both'}, 'expandable':{w:970,h:250,kind:'Rich media',dev:'desktop'},
  'video':{w:640,h:360,kind:'Rich media',dev:'both'}, 'carousel':{w:300,h:250,kind:'Rich media',dev:'both'},
};
const GEOS = ['Delhi NCR','Mumbai','Bengaluru','Chennai','Hyderabad','Pune','Kolkata','Ahmedabad','Jaipur','Lucknow','Chandigarh','Rest of India'];
const GEO_SHARE = [.14,.11,.10,.06,.07,.06,.05,.04,.035,.03,.025,.29];

/* Inventory: generated per site × page type × device × position */
const SLOT_TEMPLATES = {
  desktop:[['Top leaderboard','728x90',.95,1],['Billboard','970x250',.6,1.6],['Right rail MPU','300x250',.9,1.2],['Half-page','300x600',.55,1.8],['In-feed native','native',.7,1.3],['Expandable masthead','expandable',.25,2.4],['In-article video','video',.3,3.0]],
  mobile:[['Sticky footer','320x50',.98,.7],['Top banner','320x100',.85,1],['In-content MPU','300x250',.9,1.25],['In-feed native','native',.8,1.35],['Native carousel','carousel',.35,1.8],['Outstream video','video',.35,2.8]],
};
const HOME_LIKE = new Set(['home','listing','carpages','bikepages','ev']);
const INVENTORY = [];
(function buildInventory(){
  const r = rng('inv');
  for (const s of Object.values(SITES)) for (const [pt,,share] of PAGE_TYPES[s.id]) for (const dev of ['desktop','mobile']) {
    const devShare = dev==='mobile' ? .78 : .22;
    for (const [pos,fmt,fill,prem] of SLOT_TEMPLATES[dev]) {
      if ((fmt==='970x250'||fmt==='expandable') && !HOME_LIKE.has(pt)) continue;
      if (fmt==='300x600' && !['model','reviews','carpages','bikepages','compare'].includes(pt)) continue;
      if (fmt==='video' && !['model','reviews','carpages','bikepages','ev','home'].includes(pt)) continue;
      const imps = Math.round(s.pv * share * devShare * fill);
      const pagePrem = {model:1.25,compare:1.35,emi:1.4,offers:1.3,used:1.05,home:1.15,ev:1.3,reviews:1.1}[pt]||1;
      const floor = Math.round(55 * prem * pagePrem * (s.id==='cd'?1.1:s.id==='zw'?.9:.85));
      INVENTORY.push({ id:`${s.id}-${pt}-${dev[0]}-${fmt}-${pos.replace(/\W+/g,'').slice(0,6).toLowerCase()}`, site:s.id, pt, dev, pos, fmt,
        imps, floor, sold: clamp(.35 + r()*.5 + (prem>2?.1:0),0,.97), active:true });
    }
  }
})();

/* ---------- audience taxonomy ---------- */
/* each dimension: scope (car/bike/any), values with share of that scope's users (30-day window) */
const DIMS = {

  price_bike:{label:'Bike price segment', scope:'bike', vals:{'u1':['Under ₹1L',.46],'1-2':['₹1–2L',.30],'2-3':['₹2–3L',.12],'3-5':['₹3–5L',.08],'5+':['₹5L+',.04]}},
  body_car:  {label:'Car body type', scope:'car', vals:{SUV:['SUV',.41],Hatchback:['Hatchback',.24],Sedan:['Sedan',.14],MUV:['MUV / MPV',.10],Luxury:['Luxury',.06],Pickup:['Pickup',.02]}},
  body_bike: {label:'Bike category', scope:'bike', vals:{Commuter:['Commuter',.38],Scooter:['Scooter',.27],Sports:['Sports',.14],Cruiser:['Cruiser',.12],Adventure:['Adventure',.05],Premium:['Premium (₹3L+)',.12]}},
  fuel:      {label:'Fuel / powertrain', scope:'any', vals:{EV:['Electric (EV)',.12],Petrol:['Petrol',.58],Diesel:['Diesel',.17],CNG:['CNG',.08],Hybrid:['Hybrid',.05]}},
  market:    {label:'Market', scope:'any', vals:{new:['New vehicle shoppers',.71],used:['Used vehicle shoppers',.29]}},

/* reach estimation ------------------------------------------------ */
function sitePool(sites, scope){
  let t = 0;
  for (const id of sites){ const s = SITES[id]; t += s.uv * (scope==='car'? s.car : scope==='bike'? s.bike : 1); }
  return t * (sites.length>1 ? .82 : 1);          // cross-site de-duplication
}
function groupScope(g){
  let sc = 'any';
  for (const r of g.rules){ if (r.neg) continue; const d = DIMS[r.dim]; if (!d) continue;
    if (d.scope!=='any') sc = d.scope;
    if (r.dim==='vehicle' && r.vals.length===1) sc = r.vals[0]; }
  return sc;
}
function ruleShare(r){ const d = DIMS[r.dim]; if (!d || !r.vals.length) return 1; const s = clamp(sum(r.vals.map(v=>d.vals[v]?.[1]||0)),0,1); return r.neg ? 1-s : s; }
function estimateAudience(aud, sites){
  sites = sites?.length ? sites : ['cd','bd','zw'];
  const all = sitePool(sites,'any');
  const groups = (aud?.groups||[]).filter(g=>g.rules.some(r=>r.vals.length));
  if (!groups.length) return { users: all, share:1, all };
  let notReached = 1;
  for (const g of groups){
    const sc = groupScope(g); const pool = sitePool(sites, sc);
    const shares = g.rules.filter(r=>r.vals.length && !(r.dim==='vehicle' && !r.neg)).map(ruleShare);
    let p = shares.reduce((a,b)=>a*b,1);
    if (shares.length>1) p = Math.min(p * Math.pow(1.45, shares.length-1), Math.min(...shares));   // intent signals co-occur
    notReached *= 1 - clamp(pool*p/all,0,1);
  }
  const users = all * (1-notReached);
  return { users, share: users/all, all };
}
/* ad opportunities per user per month on selected inventory */
function inventoryFor(sel){
  return INVENTORY.filter(i => i.active && sel.sites.includes(i.site)
    && (!sel.pageTypes?.length || sel.pageTypes.includes(i.pt))
    && (!sel.devices?.length || sel.devices.includes(i.dev))
    && (!sel.formats?.length || sel.formats.includes(i.fmt)));
}
function forecast(c){
  const est = estimateAudience(c.audience, c.sites);
  const inv = inventoryFor(c);
  const invImps = sum(inv.map(i=>i.imps));
  const siteAll = sum(c.sites.map(id=>SITES[id].pv*2.6));        // all ad opportunities on those sites
  const geoShare = c.geos?.length ? sum(c.geos.map(g=>GEO_SHARE[GEOS.indexOf(g)]||0)) : 1;
  const availImps = invImps * est.share * geoShare;
  const unsold = sum(inv.map(i=>i.imps*(1-i.sold))) * est.share * geoShare;
  const days = Math.max(1, Math.round((new Date(c.end)-new Date(c.start))/DAY)+1);
  const monthScale = days/30;
  const freqPerMonth = (c.freq?.n||3) * (c.freq?.per==='week'? 30/7 : c.freq?.per==='flight' ? 1/monthScale : 30) ;
  const pageShare = siteAll? invImps/siteAll : 0;
  const reachable = est.users * geoShare * clamp(pageShare*2.2,0.05,1);
  const budgetImps = c.model==='CPM' ? c.budget/c.bid*1000 : c.model==='CPC' ? c.budget/c.bid/0.011 : c.model==='CPL' ? c.budget/c.bid/0.011/0.035 : Infinity;
  const capImps = reachable * freqPerMonth * monthScale * .35;     // users rarely hit the cap every day
  const deliverable = Math.min(unsold*monthScale, capImps);
  const estImps = Math.min(deliverable, budgetImps);
  const estReach = Math.min(reachable, estImps / Math.max(1.3, Math.min(freqPerMonth*monthScale*.12, 6)));
  return { users: est.users*geoShare, availMonthly: availImps, unsoldMonthly: unsold, estImps, estReach, budgetImps, deliverable,
    ok: est.users*geoShare >= K_ANON, canDeliver: deliverable >= budgetImps*.95, days, invCount: inv.length };
}

/* delivery state (spend, impressions …) — seeded */
function flight(c){ const s=new Date(c.start+'T00:00:00+05:30'), e=new Date(c.end+'T23:59:59+05:30'); const total=Math.round((e-s)/DAY); const elapsed=clamp((TODAY-s)/DAY,0,total); return {s,e,total,elapsed,remaining:Math.max(0,total-elapsed)}; }
function status(c){ const f=flight(c); if (c.paused) return 'paused'; if (TODAY<f.s) return 'sched'; if (TODAY>f.e || c.stats.spend>=c.budget) return 'ended'; const p=pacing(c); if (p.pace<.8) return 'limited'; return 'live'; }
const STATUS_LABEL = {live:'Delivering',sched:'Scheduled',paused:'Paused',ended:'Completed',limited:'Under-delivering'};
function effBid(c){ // eCPM
  if (c.model==='CPM') return c.bid;
  if (c.model==='CPC') return c.bid * (c.stats?.ctr||.011) * 1000;
  if (c.model==='CPL') return c.bid * (c.stats?.ctr||.011) * .035 * 1000;
  if (c.model==='Sponsorship') return c.bid / Math.max(1,(forecast(c).estImps||1)) * 1000;
  return c.bid;
}
function seedStats(c){
  const r = rng(c.id); const f = flight(c);
  const paceBias = {'C-1041':1.02,'C-1042':.93,'C-1043':1.0,'C-1044':.71,'C-1045':1.08,'C-1046':1,'C-1039':1}[c.id]||1;
  const frac = f.total ? f.elapsed/f.total : 0;
  const spend = Math.min(c.budget, c.budget*frac*paceBias);
  const ctrBase = {CPM:.0085,CPC:.013,CPL:.012,Sponsorship:.007}[c.model] * (0.85+r()*.4);
  const cpm = c.model==='CPM'? c.bid : c.model==='Sponsorship'? 190 : c.model==='CPC' ? c.bid*ctrBase*1000 : c.bid*ctrBase*.035*1000;
  const imps = Math.round(spend/cpm*1000);
  const clicks = Math.round(imps*ctrBase);
  const conv = Math.round(clicks*(c.objective.includes('Lead')||c.objective==='Test Drive' ? .034+r()*.01 : .012));
  c.stats = { spend, imps, clicks, conv, ctr: imps? clicks/imps : ctrBase, videoViews: c.formats.includes('video')? Math.round(imps*.09):0, todaySpend: f.elapsed>0 && f.remaining>0 ? (c.daily*(.55+r()*.3)) : 0, reach: Math.round(imps/(2.4+r())) };
}
CAMPAIGNS.forEach(seedStats);

/* ---------- pacing engine ---------- */
function pacing(c){
  const f = flight(c); const st = c.stats;
  const ideal = f.total ? c.budget * f.elapsed / f.total : 0;
  const pace = ideal ? st.spend/ideal : 1;
  const remBudget = Math.max(0, c.budget - st.spend);
  const targetDaily = f.remaining>0 ? Math.min(c.daily||Infinity, remBudget / Math.max(1,f.remaining)) : 0;
  const fc = forecast(c);
  const availDailySpend = fc.unsoldMonthly/30 * effBid(c)/1000;
  const throttle = availDailySpend>0 ? clamp(targetDaily/availDailySpend,0.02,1) : 0;
  let state = 'On pace';
  if (pace<.9) state = 'Behind'; if (pace>1.1) state='Ahead';
  if (pace<.9 && c.daily && targetDaily>=c.daily) state='Behind — daily cap limits catch-up';
  if (remBudget<=0) state='Budget exhausted';
  return { ideal, pace, remBudget, targetDaily, throttle, availDailySpend, state, f };
}

/* page context → audience attributes (what the classifier emits; never PII) */
function classify(req){
  const a = { site:[req.site], vehicle:[req.vehicle], market:[req.market], fuel:[req.fuel], brand:[req.brand], model:req.model?[req.model]:[],
              intent:req.intents.slice(), visitor:[req.repeat?'repeat':'new'], recency:['7d','14d','30d'], tier:[req.tier] };
  if (req.vehicle==='car'){
    const p=req.price; a.price_car=[p<5?'u5':p<10?'5-10':p<15?'10-15':p<20?'15-20':p<30?'20-30':p<50?'30-50':'50+'];
    a.body_car=[req.body]; if (p>=50 && req.body!=='Luxury') a.body_car.push('Luxury');
  } else {
    const p=req.price; a.price_bike=[p<1?'u1':p<2?'1-2':p<3?'2-3':p<5?'3-5':'5+']; a.body_bike=[req.body]; if (p>=3) a.body_bike.push('Premium');
  }
  const strong = req.intents.filter(i=>['onroad','emi','offers','dealer','testdrive','lead'].includes(i)).length;
  a.intent_lvl = [strong>=2 || (strong>=1 && req.repeat) ? 'high' : req.intents.length ? 'medium' : 'low'];
  return a;
}
function matchAudience(aud, attrs){
  const groups=(aud?.groups||[]).filter(g=>g.rules.some(r=>r.vals.length));
  if (!groups.length) return {ok:true, why:'Run of network'};
  for (const g of groups){
    let ok=true; for (const r of g.rules){ if(!r.vals.length) continue; const have=attrs[r.dim]||[]; const hit=r.vals.some(v=>have.includes(v)); if (r.neg?hit:!hit){ok=false;break;} }
    if (ok) return {ok:true, why:g.rules.filter(r=>r.vals.length).map(r=>(r.neg?'NOT ':'')+r.vals.map(v=>dimLabel(r.dim,v)).join('/')).join(' ∧ ')};
  }
  return {ok:false, why:'No audience group matched'};
}

    if (ok) (TODAY>=f.s && TODAY<=f.e) ? pass('Flight',`${dstr(f.s)}–${dstr(f.e)}`) : fail('Flight', TODAY<f.s?'Starts '+dstr(f.s):'Ended '+dstr(f.e));

    if (ok) (!c.devices.length || c.devices.includes(req.device)) ? pass('Device',req.device) : fail('Device','Device excluded');
    if (ok) (!c.geos.length || c.geos.includes(req.geo)) ? pass('Geo',req.geo) : fail('Geo','Outside geo targeting');
    if (ok) { const fm=c.formats.filter(x=>slotFormats.includes(x)); fm.length? pass('Format',fm[0]) : fail('Format','No creative fits slot'); }
    if (ok) { const m=matchAudience(c.audience,attrs); m.ok? pass('Audience',m.why) : fail('Audience',m.why); }
    if (ok) (c.stats.spend < c.budget) ? pass('Budget',fmtINR(c.budget-c.stats.spend)+' left') : fail('Budget','Budget exhausted');
    if (ok) (!c.daily || c.stats.todaySpend < c.daily) ? pass('Daily cap',fmtINR(c.stats.todaySpend)+' / '+fmtINR(c.daily)) : fail('Daily cap','Daily budget reached');
    if (ok) { const k=`${uid}|${c.id}|${day}`; const n=FREQ.get(k)||0; n < c.freq.n ? pass('Frequency',`${n}/${c.freq.n} today`) : fail('Frequency',`Cap reached (${n}/${c.freq.n})`); }
    let thr=1; if (ok && c.model!=='Sponsorship'){ const p=pacing(c); thr=p.throttle; const roll=(opts.rand||Math.random)(); roll<=thr ? pass('Pacing',`throttle ${pct(thr,0)} · roll ${roll.toFixed(2)}`) : fail('Pacing',`Held back to pace (throttle ${pct(thr,0)})`); }
    const ecpm = effBid(c);
    const score = ok ? (c.priority>=10 ? 1e9 : ecpm * (1 + c.priority/10)) : 0;
    rows.push({c, ok, checks, ecpm, score});
  }
  const eligible = rows.filter(r=>r.ok).sort((a,b)=>b.score-a.score);
  const win = eligible[0]||null;
  if (win && !opts.dry){
    const k=`${uid}|${win.c.id}|${day}`; FREQ.set(k,(FREQ.get(k)||0)+1);
    const price = win.c.model==='Sponsorship'? 0 : win.ecpm/1000;
    win.c.stats.imps++; win.c.stats.spend+=price; win.c.stats.todaySpend+=price;
  }
  const ms = performance.now()-t0;
  return { attrs, uid, rows, eligible, win, ms };
}

/* line / area chart with hover crosshair */
function lineChart(id, labels, series, {h=200, fmt=fmtN}={}){
  const W=720, H=h, L=48, R=14, T=12, B=26;
  const max = Math.max(...series.flatMap(s=>s.vals))*1.1 || 1;
  const nice = (()=>{ const p=Math.pow(10,Math.floor(Math.log10(max))); const m=max/p; return (m<=2?2:m<=5?5:10)*p; })();
  const x = i => L + (W-L-R) * (labels.length<2?0:i/(labels.length-1));
  const y = v => T + (H-T-B) * (1 - v/nice);
  const ticks=[0,.25,.5,.75,1].map(f=>f*nice);
  let g = ticks.map(t=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${fmt(t)}</text>`).join('');
  const step = Math.ceil(labels.length/7);
  g += labels.map((l,i)=> (i%step===0 && labels.length-1-i>=step*.6)||i===labels.length-1 ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`:'').join('');
  for (const s of series){
    const pts = s.vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (s.area) g += `<polygon points="${x(0)},${y(0)} ${pts} ${x(s.vals.length-1)},${y(0)}" fill="${s.color}" fill-opacity=".12"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.vals.length-1; g += `<circle cx="${x(li)}" cy="${y(s.vals[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }
  g += `<line id="${id}-x" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += `<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" data-chart="${id}"/>`;
  CHARTS[id] = {labels, series, x, L, W, R, fmt};
  return `<div style="position:relative"><svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))} over time">${g}</svg><div class="tip" id="${id}-tip" hidden></div></div>`;
}
const CHARTS = {};
document.addEventListener('pointermove', e=>{
  const r = e.target.closest?.('[data-chart]'); document.querySelectorAll('.tip').forEach(t=>{ if(!r || t.id!==r.dataset.chart+'-tip') t.hidden=true; });
  document.querySelectorAll('.chart line[id$="-x"]').forEach(l=>{ if(!r || l.id!==r.dataset.chart+'-x') l.setAttribute('visibility','hidden'); });
  if (!r) return; const c = CHARTS[r.dataset.chart]; const svg = r.ownerSVGElement; const bb = svg.getBoundingClientRect();
  const sx = (e.clientX-bb.left)/bb.width*c.W; const n=c.labels.length; const i = clamp(Math.round((sx-c.L)/((c.W-c.L-c.R)/(n-1||1))),0,n-1);
  const ln = $('#'+r.dataset.chart+'-x'); ln.setAttribute('x1',c.x(i)); ln.setAttribute('x2',c.x(i)); ln.setAttribute('visibility','visible');
  const tip = $('#'+r.dataset.chart+'-tip'); tip.hidden=false;
  tip.innerHTML = `<b>${c.labels[i]}</b>`+c.series.map(s=>`<div><i style="background:${s.color}"></i>${s.name}: <span>${c.fmt(s.vals[i])}</span></div>`).join('');
  const px = c.x(i)/c.W*bb.width; tip.style.left = Math.min(px+12, bb.width-150)+'px'; tip.style.top='8px';
});

function forecastPanel(){
  const d=S.draft; if (!d) return '';

  const verdict = !f.ok ? `<div class="note bad">This audience has fewer than ${K_ANON.toLocaleString('en-IN')} users. Broaden it — narrow audiences can't be targeted, to protect user privacy.</div>`
    : d.model==='Sponsorship' ? `<div class="note good">Fixed sponsorship: ${fmtN(f.deliverable)} impressions available on the selected placements for the flight.</div>`
    : f.canDeliver ? `<div class="note good">Deliverable. Your budget buys ~${fmtN(f.budgetImps)} impressions and ${fmtN(f.deliverable)} are available.</div>`
    : `<div class="note warn">At risk: budget needs ~${fmtN(f.budgetImps)} impressions but only ~${fmtN(f.deliverable)} are available. Add websites, pages or formats, relax frequency, or lower the budget.</div>`;
  const rows = [['Selected audience', esc(d.audienceName)],['Available users', fmtN(f.users)],['Available monthly impressions', fmtN(f.availMonthly)],['Selected inventory', `${f.invCount} placements on ${d.sites.map(s=>SITES[s].name).join(', ')}`],['Estimated reach', fmtN(f.estReach)],['Estimated impressions', fmtN(f.estImps)],['Flight', `${f.days} days · ${dstr(d.start)} – ${dstr(d.end)}`]];
  return `<header><h2>Delivery forecast</h2><span class="sp"></span><span class="sub">updates live</span></header><div class="body stack">
    <div><div class="eyebrow">Estimated reach</div><div class="big">${fmtN(f.estReach)}</div><div class="muted" style="font-size:12px">of ${fmtN(f.users)} users in this audience</div></div>
    <div class="funnel">${rows.map(([l,v])=>`<div class="fr"><span class="muted">${l}</span><b style="text-align:right;font-variant-numeric:tabular-nums">${v}</b></div>`).join('')}</div>
    <div class="funnel"><div class="fr"><span class="muted">Budget covers</span><span class="mono">${d.model==='Sponsorship'?'fixed':fmtN(f.budgetImps)} impr.</span>${bar(d.model==='Sponsorship'?1:Math.min(1,f.deliverable/f.budgetImps), {cls: f.canDeliver?'':'warn'})}</div></div>
    ${verdict}
    <p class="muted" style="font-size:11.5px;margin:0">Audience sizes are 30-day de-duplicated users across the selected sites. Advertisers only ever see aggregated counts.</p></div>`;
}

      <label class="f" for="cr-url">Landing page URL<input id="cr-url" type="url" data-bind="draft.creative.url" data-live="1" value="${esc(cr.url)}"></label>
      <div class="note mono" style="word-break:break-all;font-size:11.5px">Click-through: ${esc(cr.url)}?utm_source=torque&amp;utm_medium=display&amp;utm_campaign=${esc((d.name||'campaign').toLowerCase().replace(/\W+/g,'_'))}&amp;utm_content={placement}_{size}</div>
      ${cr.img?'<button class="btn sm" data-act="clear-img">Remove uploaded image</button>':''}
    </div><div class="stack"><div class="eyebrow">Preview on ${SITES[d.sites[0]||'cd'].name}</div>${devicePreview(cr, dk, mb, d.sites[0]||'cd')}</div></div>`; },
  d => { const f=forecast(d); const rows=[['Name',esc(d.name)],['Objective',d.objective],['Websites',d.sites.map(siteTag).join(' ')],['Audience',`<b>${esc(d.audienceName)}</b><div class="muted" style="font-size:12px">${esc(audSummary(d.audience))}</div>`],['Inventory',`${d.pageTypes.length?d.pageTypes.map(p=>pageName(d.sites.find(s=>PAGE_TYPES[s].some(x=>x[0]===p))||'cd',p)).join(', '):'All pages'} · ${d.devices.join(' + ')} · ${d.formats.join(', ')}`],['Geography',d.geos.length?d.geos.join(', '):'All India'],['Budget',`${fmtINRx(d.budget)} total · ${fmtINRx(d.daily)}/day cap · ${d.model} ${d.model==='Sponsorship'?'':'₹'+d.bid}`],['Flight',`${dstr(d.start)} – ${dstr(d.end)} (${f.days} days)`],['Frequency',`${d.freq.n} per user per ${d.freq.per}`],['Landing page',esc(d.creative.url)]];

ACT['pick-aud'] = el => { const d=S.draft; const src = el.dataset.kind==='pkg' ? PACKAGES.find(p=>p.id===el.dataset.id) : AUDIENCES.find(a=>a.id===el.dataset.id); d.audienceName=src.name; d.audience=clone(src.aud); render(); };
ACT['set-all-pages'] = () => { S.draft.pageTypes=[]; render(); };
ACT.freq = el => { S.draft.freq={n:+el.dataset.n, per:'day'}; render(); };
ACT['clear-img'] = () => { S.draft.creative.img=null; render(); };
ACT_CHANGE.upload = el => { const file=el.files[0]; if(!file) return; if (!file.type.startsWith('image/')){ toast('Video received — preview shows a poster frame'); return; } const r=new FileReader(); r.onload=()=>{ S.draft.creative.img=r.result; render(); }; r.readAsDataURL(file); };

/* ---- Audiences ---- */
VIEWS.audiences = () => {
  const a=S.audDraft; const e=estimateAudience(a.aud, a.sites);
  const imps = e.users * sum(a.sites.map(s=>SITES[s].pv*2.6))/sum(a.sites.map(s=>SITES[s].uv)) ;
  const bySite = a.sites.map(s=>[SITES[s].name, estimateAudience(a.aud,[s]).users]);
  const byPrice = Object.entries(DIMS.price_car.vals).map(([k,[l]])=>{ const g=clone(a.aud); if(!g.groups.length) g.groups=[{rules:[]}]; g.groups.forEach(gr=>{ const r=gr.rules.find(r=>r.dim==='price_car'); if (r){ if(!r.vals.includes(k)) r.vals=['__none']; else r.vals=[k]; } else gr.rules.push({dim:'price_car',vals:[k]}); }); return [l, estimateAudience(g,a.sites.filter(s=>SITES[s].car)).users]; });
  const ok = e.users >= K_ANON;
  return `<div class="grid g-side"><div class="stack" style="gap:16px">
    ${panel('Build an audience', `<div class="stack"><div class="grid g2"><label class="f" for="ad-name">Audience name<input id="ad-name" type="text" data-bind="audDraft.name" value="${esc(a.name)}"></label>
       <div class="f"><span>Websites</span>${chips('audDraft.sites',Object.values(SITES).map(s=>[s.id,s.name]),a.sites)}</div></div>
       ${builderHTML('audDraft.aud')}
       <div class="note"><b>Logic:</b> ${esc(audSummary(a.aud))}</div></div>`, {sub:'Conditions inside a group are joined with AND; groups are joined with OR'})}
    ${panel('Saved audiences', `<div class="tbl-wrap"><table><thead><tr><th>Audience</th><th>Definition</th><th class="n">Users (all sites)</th><th></th></tr></thead><tbody>${AUDIENCES.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="ink2" style="font-size:12.5px">${esc(audSummary(x.aud))}</td><td class="n">${fmtN(estimateAudience(x.aud).users)}</td><td><button class="btn sm" data-act="edit-aud" data-id="${x.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`, {pad:false})}
  </div>
  <aside class="panel reach-card"><header><h2>Audience size</h2><span class="sp"></span><span class="sub">30-day users</span></header><div class="body stack">
    <div><div class="eyebrow">Estimated reach</div><div class="big">${fmtN(e.users)} users</div><div class="muted" style="font-size:12px">${pct(e.share)} of ${fmtN(e.all)} automotive users on the selected sites</div></div>
    <div><div class="eyebrow">Eligible monthly impressions</div><div class="big" style="font-size:22px">${fmtN(imps)}</div></div>
    ${bySite.length>1?`<div><div class="eyebrow" style="margin-bottom:6px">By website</div>${hbars(bySite)}</div>`:''}
    ${a.sites.some(s=>SITES[s].car)?`<div><div class="eyebrow" style="margin-bottom:6px">By car price segment</div>${hbars(byPrice.filter(r=>r[1]>0))}</div>`:''}
    ${ok?'':`<div class="note bad">Below the ${K_ANON.toLocaleString('en-IN')}-user privacy minimum. Remove a condition to save.</div>`}
    <button class="btn pri" data-act="save-aud" ${ok?'':'disabled'}>Save audience</button>
    <p class="muted" style="font-size:11.5px;margin:0">No names, phone numbers, emails or browsing histories are ever exposed — only cohort counts.</p></div></aside></div>`;
};
ACT['save-aud'] = () => { const a=S.audDraft; const e=estimateAudience(a.aud,a.sites); const ex=AUDIENCES.find(x=>x.name===a.name);
  if (ex) ex.aud=clone(a.aud); else AUDIENCES.push({id:'a'+(AUDIENCES.length+1), name:a.name, note:audSummary(a.aud).slice(0,60), aud:clone(a.aud)});
  audit('marketing@'+advName(S.advId).split(' ')[0].toLowerCase(),'Advertiser','Saved audience',`${a.name} · est. ${fmtN(e.users)} users`); toast('Audience saved'); render(); };
ACT['edit-aud'] = el => { const x=AUDIENCES.find(a=>a.id===el.dataset.id); S.audDraft={name:x.name, sites:['cd','bd','zw'], aud:clone(x.aud)}; render(); window.scrollTo({top:0}); };

/* ---- Packages ---- */

/* ---- Inventory & forecasting (advertiser) ---- */
VIEWS.inventory = () => {
  const fs=S.fcSel; const opts=[...PACKAGES.map(p=>['pkg:'+p.id,p.name]),...AUDIENCES.map(a=>['aud:'+a.id,a.name])];
  const src = fs.aud.startsWith('pkg:')? PACKAGES.find(p=>'pkg:'+p.id===fs.aud) : AUDIENCES.find(a=>'aud:'+a.id===fs.aud);
  let aud = clone(src.aud);
  if (fs.priceFocus!=='any'){ if(!aud.groups.length) aud.groups=[{rules:[]}]; aud.groups.forEach(g=>{ const r=g.rules.find(r=>r.dim==='price_car'); if(r) r.vals=[fs.priceFocus]; else g.rules.push({dim:'price_car',vals:[fs.priceFocus]}); }); }
  const c = {sites:fs.sites.length?fs.sites:['cd'], audience:aud, pageTypes:fs.pageTypes, devices:fs.devices, formats:[], geos:[], start:'2026-10-01', end:'2026-10-30', budget:1e12, model:'CPM', bid:250, freq:{n:3,per:'day'}};
  const f=forecast(c); const full=estimateAudience(aud,c.sites);
  const audName = (fs.priceFocus!=='any'? dimLabel('price_car',fs.priceFocus)+' ':'') + src.name.replace(' Audience','') + (fs.priceFocus!=='any'&&!/Buyers|Intenders/.test(src.name)?' Buyers':'');
  const invName = `${c.sites.map(s=>SITES[s].name).join(' + ')} ${fs.pageTypes.length? fs.pageTypes.map(p=>pageName(c.sites.find(s=>PAGE_TYPES[s].some(x=>x[0]===p))||c.sites[0],p)).join(', ') : 'all pages'}`;
  const pts = []; c.sites.forEach(s=>PAGE_TYPES[s].forEach(p=>{ if(!pts.find(x=>x[0]===p[0])) pts.push([p[0],p[1]]); }));
  const inv = inventoryFor({sites:c.sites, pageTypes:[], devices:fs.devices});
  const byPt = pts.map(([pt,l])=>{ const rows=inv.filter(i=>i.pt===pt); const imps=sum(rows.map(i=>i.imps)); return [l, imps, sum(rows.map(i=>i.imps*(1-i.sold))), imps? sum(rows.map(i=>i.floor*i.imps))/imps : 0]; }).filter(r=>r[1]);
  return `<div class="grid g2">${panel('Forecast a buy', `<div class="stack">
      <label class="f" for="fc-aud">Audience<select id="fc-aud" data-bind="fcSel.aud" data-rr="1">${opts.map(([v,l])=>`<option value="${v}" ${v===fs.aud?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
      <label class="f" for="fc-price">Car price focus<select id="fc-price" data-bind="fcSel.priceFocus" data-rr="1"><option value="any">Keep audience as defined</option>${Object.entries(DIMS.price_car.vals).map(([k,[l]])=>`<option value="${k}" ${k===fs.priceFocus?'selected':''}>${l}</option>`).join('')}</select></label>
      <div class="f"><span>Websites</span>${chips('fcSel.sites',Object.values(SITES).map(s=>[s.id,s.name]),fs.sites)}</div>
      <div class="f"><span>Page types (none = all)</span>${chips('fcSel.pageTypes',pts,fs.pageTypes)}</div>
      <div class="f"><span>Devices (none = all)</span>${chips('fcSel.devices',[['mobile','Mobile'],['desktop','Desktop']],fs.devices)}</div></div>`)}
    <section class="panel"><header><h2>Forecast</h2><span class="sp"></span><span class="sub">next 30 days · 3/user/day cap</span></header><div class="body stack">
      <div class="tbl-wrap"><table><tbody>
        <tr><th>Selected audience</th><td class="n"><b>${esc(audName)}</b></td></tr>
        <tr><th>Available users</th><td class="n">${fmtN(full.users)}</td></tr>
        <tr><th>Available monthly impressions</th><td class="n">${fmtN(f.availMonthly)}</td></tr>
        <tr><th>Selected inventory</th><td class="n">${esc(invName)}</td></tr>
        <tr><th>Estimated reach</th><td class="n">${fmtN(f.estReach)}</td></tr>
        <tr><th>Estimated impressions</th><td class="n"><b>${fmtN(f.estImps)}</b></td></tr>
        <tr><th>Unsold share</th><td class="n">${pct(f.unsoldMonthly/f.availMonthly||0,0)} still open</td></tr></tbody></table></div>

  cohort:['Audience cohort', c=>[['High intent',.18],['Medium intent',.35],['Low intent',.47]]],
};
function breakdown(c, key){
  const r=rng(c.id+key); const parts=BREAKDOWNS[key][1](c); const tw=sum(parts.map(p=>p[1]));
  const rows = parts.map(([l,w],i)=>{ const lift = key==='cohort'? [1.7,1.05,.72][i] : key==='visitor'? [.88,1.18][i] : key==='price' ? .75 + i*.12 + r()*.25 : .7+r()*.6;
    const imps=Math.round(c.stats.imps*w/tw); const clicks=Math.round(imps*c.stats.ctr*lift); const spend=c.stats.spend*w/tw; const conv=Math.round(clicks*(c.stats.conv/(c.stats.clicks||1))*(0.8+r()*.4)); return {l, imps, clicks, spend, conv}; });
  return rows;
}
VIEWS.reports = () => {
  const list=myCampaigns(); if (!list.length) return '<div class="note">No campaigns yet.</div>';
  const c=list.find(x=>x.id===S.rep.cid)||list[0]; S.rep.cid=c.id; let st=c.stats; const f=flight(c);
  const days=Math.max(1,Math.floor(f.elapsed)); const r=rng(c.id+'d'); const labels=[], imps=[], clicks=[];
  for (let i=0;i<days;i++){ const dt=new Date(f.s.getTime()+i*DAY); labels.push(dstr(dt)); const w=(1+.25*Math.sin(i/2.2)+(r()-.5)*.25)*(dt.getDay()%6===0?.86:1); imps.push(w); }
  const tw=sum(imps)||1; for (let i=0;i<imps.length;i++){ imps[i]=Math.round(st.imps*imps[i]/tw); clicks.push(Math.round(imps[i]*st.ctr*(0.9+r()*.2))); }
  if (S.rep.range!=='all'){ const n=+S.rep.range; const tI=sum(imps)||1; const k=n<labels.length? n:labels.length; const sI=sum(imps.slice(-k)); const fac=sI/tI; labels.splice(0,labels.length-k); imps.splice(0,imps.length-k); clicks.splice(0,clicks.length-k);
    st = Object.assign({}, st, {imps:Math.round(st.imps*fac), clicks:Math.round(st.clicks*fac), spend:st.spend*fac, conv:Math.round(st.conv*fac), reach:Math.round(st.reach*Math.sqrt(fac)), videoViews:Math.round(st.videoViews*fac)}); S._fac=fac; } else S._fac=1;
  const rows=breakdown(c,S.rep.dim).map(x=>({...x, imps:Math.round(x.imps*S._fac), clicks:Math.round(x.clicks*S._fac), spend:x.spend*S._fac, conv:Math.round(x.conv*S._fac)})); const avgCtr=st.ctr;
  const shown=rows.filter(x=>x.imps>=REPORT_K), hidden=rows.length-shown.length;
  const cpm=st.imps? st.spend/st.imps*1000:0, cpc=st.clicks? st.spend/st.clicks:0; const leads = c.objective.match(/Lead|Test/)? st.conv : Math.round(st.conv*.4);
  const vv = st.videoViews;
  const ins = insights(c);
  return `  ${kpis([['Impressions',fmtN(st.imps),`${fmtN(st.reach)} reach`],['Clicks',fmtN(st.clicks),pct(st.ctr,2)+' CTR'],['Spend',fmtINR(st.spend),pct(st.spend/c.budget,0)+' of budget'],['eCPM · CPC',`₹${Math.round(cpm)}`,`₹${cpc.toFixed(1)} per click`],['Video views',vv?fmtN(vv):'—',vv?pct(.62,0)+' view-through':'no video'],['Conversions',fmtN(st.conv),pct(st.conv/(st.clicks||1),1)+' CVR'],['Leads',fmtN(leads),leads?fmtINRx(st.spend/leads)+' CPL':'']])}
  <div class="grid g2">${panel('Daily impressions', lineChart('ch-imp',labels,[{name:'Impressions',color:'var(--c1)',vals:imps,area:true}]), {sub:'hover for values'})}
  ${panel('Daily clicks', lineChart('ch-clk',labels,[{name:'Clicks',color:'var(--c2)',vals:clicks,area:true}]), {sub:'hover for values'})}</div>
  <div class="grid g-side">${panel('Performance by '+BREAKDOWNS[S.rep.dim][0].toLowerCase(), `<div class="tbl-wrap"><table><thead><tr><th>${BREAKDOWNS[S.rep.dim][0]}</th><th class="n">Impressions</th><th class="n">Clicks</th><th class="n">CTR</th><th>CTR vs avg.</th><th class="n">Spend</th><th class="n">Conv.</th></tr></thead><tbody>
    ${shown.map(x=>{ const ctr=x.clicks/x.imps; const idx=ctr/avgCtr; return `<tr><td>${esc(x.l)}</td><td class="n">${fmtN(x.imps)}</td><td class="n">${fmtN(x.clicks)}</td><td class="n">${pct(ctr,2)}</td><td style="width:150px"><div class="row" style="gap:6px;flex-wrap:nowrap">${bar(idx/2,{mark:.5,cls:idx<.9?'warn':''})}<span class="mono ${idx>=1.1?'up':idx<.9?'dn':''}">${idx.toFixed(2)}×</span></div></td><td class="n">${fmtINR(x.spend)}</td><td class="n">${fmtN(x.conv)}</td></tr>`; }).join('')}
    </tbody></table></div>${hidden?`<div class="body" style="padding-top:0"><div class="note">${hidden} row(s) under ${REPORT_K} impressions are hidden to keep reporting aggregated.</div></div>`:''}`, {pad:false, actions:`<select aria-label="Breakdown" data-bind="rep.dim" data-rr="1" style="width:auto">${Object.entries(BREAKDOWNS).map(([k,[l]])=>`<option value="${k}" ${k===S.rep.dim?'selected':''}>${l}</option>`).join('')}</select>`})}
  ${panel('Optimisation suggestions', `<div class="stack">${ins.map(i=>`<div class="insight"><b>${i.t}</b><p>${i.p}</p><span class="why">${i.why}</span>${i.act?`<div><button class="btn sm" data-act="${i.act}" data-id="${c.id}">${i.actL}</button></div>`:''}</div>`).join('')||'<div class="muted">Not enough data yet.</div>'}</div>`, {sub:'rule-based today, model-based in Phase 3'})}</div>`;
};
function insights(c){
  const out=[]; if (c.stats.imps<5000) return out;
  const pr=breakdown(c,'price').filter(x=>x.imps>=REPORT_K); const avg=c.stats.ctr;
  const best=pr.map(x=>({...x,idx:x.clicks/x.imps/avg})).sort((a,b)=>b.idx-a.idx)[0];
  if (best && best.idx>1.15) out.push({t:`Shift delivery toward ${best.l}`, p:`The ${best.l} cohort has ${best.idx.toFixed(1)}× the campaign's average CTR. Consider increasing delivery to this cohort.`, why:`CTR ${pct(best.clicks/best.imps,2)} vs ${pct(avg,2)} avg · ${fmtN(best.imps)} impressions`});
  const coh=breakdown(c,'cohort'); const hi=coh[0], lo=coh[2]; const r=(hi.clicks/hi.imps)/(lo.clicks/lo.imps);
  out.push({t:'High-intent users convert better', p:`High-intent users click ${r.toFixed(1)}× more than low-intent users. Adding a high-intent condition would lift CTR but shrink reach by ~${pct(1-.18,0)}.`, why:`${fmtN(hi.imps)} vs ${fmtN(lo.imps)} impressions compared`});
  const p=pacing(c); if (p.pace<.9 && status(c)!=='ended') out.push({t:'Campaign is behind pace', p:`Spend is at ${pct(p.pace,0)} of where it should be. Adding page types or relaxing frequency to 5/day would open ~${fmtN(forecast(c).unsoldMonthly*.3)} more impressions.`, why:`ideal ${fmtINR(p.ideal)} vs actual ${fmtINR(c.stats.spend)}`});
  const dv=breakdown(c,'device'); if (dv.length===2){ const [m,d]=dv; const rm=(m.clicks/m.imps)/(d.clicks/d.imps); if (Math.abs(rm-1)>.15) out.push({t:`${rm>1?'Mobile':'Desktop'} outperforms`, p:`${rm>1?'Mobile':'Desktop'} CTR is ${Math.max(rm,1/rm).toFixed(2)}× the other device. Consider a device bid adjustment.`, why:`mobile ${pct(m.clicks/m.imps,2)} · desktop ${pct(d.clicks/d.imps,2)}`}); }
  return out;
}

  ${CAMPAIGNS.map(c=>{ const p=pacing(c); const st=status(c); return `<tr><td><b>${esc(c.name)}</b><div class="muted mono">${c.id} · ${esc(advName(c.adv))}</div></td><td>${pill(st)}</td><td class="n">${fmtINR(c.budget)}</td><td class="n">${fmtINR(c.stats.spend)}</td><td class="n">${fmtINR(p.ideal)}</td>

ACT.serve5 = () => { for (let i=0;i<5;i++) S.simResult = decide(S.sim); render(); toast('Served 5 requests to the same browser — frequency caps now visible in the trace'); };
ACT.bulk = () => {
  const r=rng('bulk'+Date.now()); const N=10000; let filled=0, rev=0, capped=0; const times=[], wins={}, reasons={};
  const pick = (arr,w)=>{ let x=r()*sum(w); for (let i=0;i<arr.length;i++){ x-=w[i]; if(x<=0) return arr[i]; } return arr[arr.length-1]; };
  for (let i=0;i<N;i++){
    const site=pick(['cd','bd','zw'],[SITES.cd.pv,SITES.bd.pv,SITES.zw.pv]); const veh = site==='cd'?'car':site==='bd'?'bike':(r()<.68?'car':'bike');
    const pt=pick(PAGE_TYPES[site].map(p=>p[0]),PAGE_TYPES[site].map(p=>p[2]));
    const priceKeys = veh==='car'? DIMS.price_car.vals : DIMS.price_bike.vals; const pb=pick(Object.keys(priceKeys),Object.values(priceKeys).map(v=>v[1]));
    const priceMap = veh==='car'? {'u5':4,'5-10':7.5,'10-15':12,'15-20':17,'20-30':24,'30-50':38,'50+':75} : {'u1':.8,'1-2':1.4,'2-3':2.4,'3-5':3.8,'5+':7};
    const bodies = veh==='car'? DIMS.body_car.vals : DIMS.body_bike.vals; const body=pick(Object.keys(bodies).filter(b=>b!=='Premium'),Object.entries(bodies).filter(([b])=>b!=='Premium').map(([,v])=>v[1]));
    const fuel=pick(Object.keys(DIMS.fuel.vals),Object.values(DIMS.fuel.vals).map(v=>v[1]));
    const intents=Object.entries(DIMS.intent.vals).filter(([,v])=>r()<v[1]).map(([k])=>k);
    const req={site, pt, vehicle:veh, price:priceMap[pb], body, fuel, brand:pick(SIM_BRANDS[veh],SIM_BRANDS[veh].map(()=>1)), model:'', market: pt==='used'||r()<.2?'used':'new', intents, device:r()<.78?'mobile':'desktop', geo:pick(GEOS,GEO_SHARE), tier:'metro', repeat:r()<.41, cookie:'sim-'+Math.floor(r()*2500)};
    const d=decide(req,{rand:r}); times.push(d.ms);
    if (d.win){ filled++; wins[d.win.c.id]=(wins[d.win.c.id]||0)+1; rev += d.win.c.model==='Sponsorship'? 190/1000 : d.win.ecpm/1000; }
    d.rows.forEach(x=>{ const f=x.checks.find(c=>!c[1]); if (f){ reasons[f[0]]=(reasons[f[0]]||0)+1; if (f[0]==='Frequency') capped++; } });
  }
  times.sort((a,b)=>a-b);
  S.bulk={n:N, filled, rev, capped, p50:times[Math.floor(N*.5)], p99:times[Math.floor(N*.99)], wins:Object.entries(wins).sort((a,b)=>b[1]-a[1]), reasons:Object.entries(reasons).sort((a,b)=>b[1]-a[1])};
  audit('ops@torque','Admin','Ran delivery simulation',`10,000 requests · ${pct(filled/N,1)} fill`); render(); toast('Simulation complete');
};

/* ---------- reach & forecast per channel ---------- */
const cohortPool = aud => estimateAudience(aud, ['cd','bd','zw']).users;
function effSplit(d){
  const chs = d.channels||['owned']; const raw = chs.map(ch=>Math.max(0, +(d.split?.[ch])||0)); const tot = sum(raw);
  const out = {}; chs.forEach((ch,i)=> out[ch] = tot ? raw[i]/tot : 1/chs.length); return out;
}
function chAudience(ch, d){
  const pool = cohortPool(d.audience);
  if (ch==='owned') return estimateAudience(d.audience, d.sites?.length? d.sites : ['cd','bd','zw']).users;
  if (ch==='youtube') return pool * OFFSITE.consent * OFFSITE.googleMatch;   // GA4 audience: every consented visitor, no login needed
  if (ch==='meta') return pool * OFFSITE.consent * OFFSITE.identifiable * OFFSITE.match[ch];
  // network: cohort users recognised on partner sites + contextual auto-intent readers
  const cats = d.net?.cats?.length ? d.net.cats : NET_CATS;
  const pubs = netLive().filter(p=>cats.includes(p.cat));
  const recognised = pool * OFFSITE.consent * OFFSITE.idSync * (sum(pubs.map(p=>p.uv))/sum(netLive().map(p=>p.uv))) * (d.net?.exchange? 2.1 : 1);
  const contextual = sum(pubs.map(p=>p.uv*p.ctx)) * .25;
  return recognised + contextual;
}
function chCpm(ch, d){
  if (ch==='youtube'||ch==='meta') return OFFSITE.media[ch]*(1+OFFSITE.mgmt) + OFFSITE.dataFee;
  if (ch==='network') return (d.net?.exchange ? (OFFSITE.media.network+OFFSITE.media.exchange)/2 : OFFSITE.media.network) + OFFSITE.dataFee*.5;
  return d.model==='CPM' ? d.bid : 250;
}
function forecastChannels(d){
  ensureDraftChannels(d); const sp = effSplit(d); const days = Math.max(1, Math.round((new Date(d.end)-new Date(d.start))/DAY)+1);
  const rows = (d.channels||['owned']).map(ch=>{
    const budget = d.budget * sp[ch];
    if (ch==='owned'){ const f = forecast(Object.assign({}, d, {budget})); return {ch, users:f.users, avail:f.availMonthly*days/30, imps:f.estImps, reach:f.estReach, budget, cpm: f.estImps? budget/f.estImps*1000 : 0, ok:f.ok, canDeliver:f.canDeliver}; }
    const users = chAudience(ch, d); const cpm = chCpm(ch, d);
    const avail = users * OFFSITE.perUser[ch] * days/30;
    const want = budget/cpm*1000; const imps = Math.min(want, avail*.6);
    const reach = Math.min(users*.85, imps/Math.max(2.2, Math.min(d.freq.n*days*.12, 6)));
    const ok = ch==='network' ? users>=K_ANON : users>=OFFSITE.minList[ch];
    return {ch, users, avail, imps, reach, budget, cpm, ok, canDeliver: want <= avail*.6*1.02};
  });
  const pool = Math.max(cohortPool(d.audience), ...rows.map(r=>r.users));
  const union = pool * (1 - rows.reduce((a,r)=>a*(1-clamp(r.reach/pool,0,1)), 1));
  return {rows, reach: union, imps: sum(rows.map(r=>r.imps)), days};
}

function unitStats(u, days=23){ const s=siteById(u.site); if (!s || s.status!=='ready') return {pv:0,imps:0,clicks:0,rev:0,fill:0};
  const w = {auto:.34, 'in-article':.28, display:.22, sticky:.16}[u.fmt]||.2; const r=rng(u.id);

function pubTotals(days=23){ const us=PUB.units.map(u=>unitStats(u,days)); const pv=sum(PUB.sites.filter(s=>s.status==='ready').map(s=>s.pvDay*days));

/* ---------- ADMIN: Publisher review queue ---------- */
function reviewQueue(){
  const own = PUB.sites.filter(s=>s.status==='review').map(s=>({key:'pub:'+s.id, pub:PUB.name, pubId:PUB.id, domain:s.domain, cat:s.cat, pv:s.pvDay*30, since:s.since, scan:s.scan}));
  const net = NET_PUBS.filter(p=>p.status!=='Live').map(p=>{ const r=rng(p.id); return {key:'net:'+p.id, pub:p.name, pubId:'pub-'+(4812063900+ +p.id.slice(1)), domain:p.domain, cat:p.cat, pv:p.pv, since:p.since, scan:{traffic:Math.round(72+r()*25), content:Math.round(66+r()*30), policy:Math.round(88+r()*12), ivt:+(r()*7).toFixed(1), safety:p.safety||Math.round(78+r()*20)}}; });
  return [...own, ...net];
}
function scanVerdict(s){ if (!s) return ['review','Scanning']; if (s.ivt>5 || s.policy<90) return ['bad','Recommend reject']; if (s.content<75 || s.traffic<75) return ['action','Needs a closer look']; return ['ready','Recommend approve']; }
VIEWS['pub-queue'] = () => { const q=reviewQueue();
  return kpis([['Waiting for review',q.length,'target: decide within 3 days'],['Auto-recommended approve',q.filter(x=>scanVerdict(x.scan)[0]==='ready').length,''],['Flagged',q.filter(x=>scanVerdict(x.scan)[0]!=='ready').length,'low content, invalid traffic or policy'],['Live publishers',netLive().length+PUB.sites.filter(s=>s.status==='ready').length,'network total']])
  + (q.length ? q.map(x=>{ const [vc,vt]=scanVerdict(x.scan); const s=x.scan||{};
    return `<section class="panel"><header><h2>${esc(x.domain)}</h2><span class="sub">${esc(x.pub)} · ${x.pubId} · ${x.cat} · ${fmtN(x.pv)} page views/month · applied ${dstr(x.since)}</span><span class="sp"></span><span class="statuschip ${vc}">${vt}</span></header>
      <div class="body stack"><div class="scan">${[['Traffic quality',s.traffic,'/100'],['Original content',s.content,'/100'],['Policy check',s.policy,'/100'],['Invalid traffic',s.ivt,'% of visits'],['Brand safety',s.safety,'/100']].map(([l,v,u])=>`<div class="sc"><span>${l}</span><b>${v??'—'}<span style="font-size:12px"> ${u}</span></b></div>`).join('')}</div>
      <div class="row"><button class="btn pri" data-act="q-approve" data-k="${x.key}">Approve</button><button class="btn" data-act="q-reject" data-k="${x.key}" data-r="Low-value content">Reject: low-value content</button><button class="btn" data-act="q-reject" data-k="${x.key}" data-r="Invalid traffic">Reject: invalid traffic</button><button class="btn ghost" data-act="q-reject" data-k="${x.key}" data-r="Policy violation">Reject: policy</button></div></div></section>`; }).join('')
    : `<div class="note good">No sites waiting for review.</div>`)
  + `<div class="note">Automated scan: crawl of 50 pages (content length, originality, prohibited content), 14-day traffic sample for bots and paid-traffic sources, and a brand-safety classifier. Reviewers see the scan and decide; every decision is written to the audit log and emailed to the publisher with the reason.</div>`; };
function resolveQ(key, approve, reason){ const [kind,id]=key.split(':');
  if (kind==='pub'){ const s=siteById(id); s.status = approve?'ready':'rejected'; if (approve && !PUB.units.some(u=>u.site===id)) PUB.units.push({id:'tq-u-'+(1001+PUB.units.length), name:'Auto ads (whole site)', site:id, fmt:'auto', size:'Automatic', created:iso(TODAY)}); return s.domain; }
  const p=NET_PUBS.find(x=>x.id===id); p.status = approve?'Live':'Rejected'; if (approve) p.safety=p.safety||93; return p.domain; }
ACT['q-approve'] = el => { const d=resolveQ(el.dataset.k, true); audit('reviewer@torque','Admin','Approved publisher site',d); toast(d+' approved — ads start serving within an hour'); render(); };
ACT['q-reject'] = el => { const d=resolveQ(el.dataset.k, false); audit('reviewer@torque','Admin','Rejected publisher site',`${d} · ${el.dataset.r}`); toast(`${d} rejected (${el.dataset.r}) — publisher notified with the reason`); render(); };

/* ---------- ADMIN: Publisher payouts ---------- */
VIEWS['pub-payouts'] = () => { const rows = [...netLive().map(p=>{ const r=rng(p.id+'pay'); const g=p.pv*2.4*.41*OFFSITE.media.network/1000*p.share; const ivt=g*(r()*.02); return [p.name, 'pub-'+(4812063900+ +p.id.slice(1)), g, ivt, (g-ivt)*.01, r()<.9?'Ready':'Hold: KYC']; }),
    [PUB.name, PUB.id, 38412, 0, 384, 'Ready']];
  const tot = sum(rows.map(r=>r[2]-r[3]-r[4]));
  return kpis([['Publishers to pay',rows.filter(r=>r[5]==='Ready').length,`${rows.length} with earnings`],['Total payout (Aug)',fmtINRx(tot),'after TDS and IVT'],['Invalid traffic withheld',fmtINRx(sum(rows.map(r=>r[3]))),'returned to advertisers'],['Payout date','21 Sep 2026','bulk NEFT']])
  + panel('August 2026 payout run', `<div class="tbl-wrap"><table><thead><tr><th>Publisher</th><th>ID</th><th class="n">Gross earnings</th><th class="n">IVT deducted</th><th class="n">TDS</th><th class="n">Net payout</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="mono">${r[1]}</td><td class="n">${fmtINRx(r[2])}</td><td class="n">${fmtINRx(r[3])}</td><td class="n">${fmtINRx(r[4])}</td><td class="n"><b style="font-weight:500">${fmtINRx(r[2]-r[3]-r[4])}</b></td><td><span class="pill ${r[5]==='Ready'?'live':'limited'}">${r[5]}</span></td></tr>`).join('')}</tbody></table></div>`, {pad:false, actions:'<button class="btn pri" data-act="payout-run">Approve payout run</button>'})
  + `<div class="note">Payouts go through a bulk-payout provider (e.g. RazorpayX) with TDS deducted as applicable and a monthly statement to each publisher. Publishers without verified PAN and bank details are held until KYC completes. Rates and TDS treatment to be confirmed with finance.</div>`; };
ACT['payout-run'] = () => { audit('finance@torque','Admin','Approved publisher payout run','Aug 2026'); toast('Payout run approved — transfers scheduled for 21 Sep'); };

render();

</script>
